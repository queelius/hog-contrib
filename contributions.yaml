  # ---- Zarankiewicz z(m,n;3,4) extremal bipartite graphs ----
  # z(m,n;3,4) = max edges in an m-by-n bipartite graph whose adjacency matrix
  # has NO 3-by-4 all-ones submatrix (no 3 row-vertices share 4 common columns).
  # This is a one-sided (ordered) condition. House of Graphs stores graphs
  # UNLABELED, so a witness must NOT be described as "K_(3,4)-free" unless BOTH
  # orientations are clean: for z(10,10) and z(9,10) a K_(3,4) occurs in the
  # permitted 4-by-3 orientation, so state the matrix condition instead. See
