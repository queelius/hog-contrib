      HoG; needs a duplicate-check before deposit.

  # ---- P_4 saturation: sat(n, P_4) minimum P_4-saturated graphs ----
  # The P_4 series is non-monotone: sat(8,P_4)=4 < sat(7,P_4)=5. Values are
  # computational (Kaszonyi-Tuza-type). Witnesses have low novelty (many small
  # forests), so these are low-priority deposits.

  - invariant: "sat(6,P_4)=3"
    n: 6
    edges: 3
    graph6: "EOOO"
    graph_file: graphs/sat6_P4_3.g6
    hog_id: null
    status: ready
    certificates: both
    non_iso_minima: null
    zenodo: 10.5281/zenodo.19985046
    verified: true
    notes: >-
      Three disjoint edges (a perfect matching on 6 vertices). P_4-saturation
      certified in the saturation paper; vertex/edge/roundtrip re-verified here.
      Low novelty; deposit only for series completeness.

