# House of Graphs (HoG) deposits by Alexander Richard Towell (queelius).
#
# Single source of truth for this portfolio. One record per graph deposit or
# deposit candidate. The value-generating computations live in the sibling
# research repo (open-problems); this repo curates the concrete witness graphs,
# tracks their House of Graphs status, and re-verifies each witness from its
# graph6 string with two separate checkers (python3 -m hogledger verify).
#
# status vocabulary:
#   deposited : live on House of Graphs with a confirmed graph id (hog_id set)
#   ready     : witness verified from scratch, both certificates in hand, not yet deposited
#   candidate : identified as worth a deposit, pending a HoG duplicate-check
#
# certificates:
#   both       : lower-bound proof (UNSAT or exhaustive enumeration or a classical
#                formula) AND an independently re-verified witness (upper bound)
#   upper-only : witness verified, matching lower bound not established here
#
# id: permanent, unique lowercase slug for citing a record; never reused.
#
# claim: {kind, statement, prior_art}. kind is one of
#   known_value        : value already published; the deposit reproduces it
#   new_value          : exact value not located in the checked prior art
#   new_classification : value known; the complete minimum family is new
#   correction         : contradicts a specific published value
#   unassessed         : prior-art status not yet recorded (a sweep target)
# Every kind except unassessed needs prior_art entries, each with a source,
# a checked date and a finding. Enter a source only after reading what it
# says. Search absence is a finding, not a novelty certificate.
#
# non_iso_minima: number of non-isomorphic minimum witnesses at the stated edge
#   count, where the enumeration established it; null when not determined.
#
# graph6 strings can contain a literal backtick (ASCII 96). Each is mirrored
# byte-exact in graphs/<graph_file>; the gate re-decodes and re-checks it.

author:
  given_names: Alexander Richard
  family_names: Towell
  handle: queelius
  email: lex@metafunctor.com
  orcid: 0000-0001-6443-9897

# Citation metadata for the ledger as a whole (rendered into CITATION.cff).
ledger:
  title: House of Graphs witness ledger
  repository: https://github.com/queelius/hog-contrib
  abstract: >-
    Extremal and saturated graphs deposited on House of Graphs, each stored as
    a byte-exact graph6 witness and accepted only when two separate
    implementations verify its defining property. Every record states its
    claim, the prior art checked for it, and the archived evidence behind it.
  keywords: [House of Graphs, graph saturation, Zarankiewicz problem, extremal graph theory, graph6]
  version: 1.0.0
  # Data (registry, witnesses, receipts, docs) is CC-BY-4.0 (LICENSE-DATA);
  # code (hogledger/, tests/) is MIT (LICENSE). pyproject.toml must agree.
  license: {data: CC-BY-4.0, code: MIT}

house_of_graphs: https://houseofgraphs.org

source_repo:
  open-problems: https://github.com/queelius/open-problems

# Papers backing these deposits (Zenodo DOIs, cited on each HoG deposit).
papers:
  saturation:
    title: "Small-order C6 saturation: exact values, minimum graphs, and a correction"
    zenodo: 10.5281/zenodo.23527267
  zarankiewicz:
    title: "Three new Zarankiewicz numbers z(m,n;3,4)"
    zenodo: 10.5281/zenodo.19985042

