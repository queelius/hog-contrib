  # ---- Zarankiewicz z(m,n;3,4) extremal bipartite graphs ----
  # z(m,n;3,4) = max edges in an m-by-n bipartite graph whose adjacency matrix
  # has NO 3-by-4 all-ones submatrix (no 3 row-vertices share 4 common columns).
  # This is a one-sided (ordered) condition. House of Graphs stores graphs
  # UNLABELED, so a witness must NOT be described as "K_(3,4)-free" unless BOTH
  # orientations are clean: for z(10,10) and z(9,10) a K_(3,4) occurs in the
  # permitted 4-by-3 orientation, so state the matrix condition instead. See
  # LESSONS.md.

  - invariant: "z(10,10;3,4)=66"
    n: 20
    edges: 66
    graph6: "SsaCC@h?G@DrXq??laIyq[eOzP?{Q?mo?"
    graph_file: graphs/z10_10_34.g6
    hog_id: 56650
    hog_url: https://houseofgraphs.org/graphs/56650
    status: deposited
    certificates: both
    non_iso_minima: null
    zenodo: 10.5281/zenodo.19985042
    verified: true
    oeis: A006615
    parts: [10, 10]
    k34_free: false
    notes: >-
      Bipartite, parts of size 10 and 10, 66 edges, adjacency matrix has no
      3-by-4 all-ones submatrix. NOT K_(3,4)-free as an abstract graph: a
      K_(3,4) occurs in the permitted 4-by-3 orientation (verified: 3 vertices
      on one side share 4 common neighbours). The public HoG comment was
      corrected on 2026-06-30 to state the matrix condition, not "K_(3,4)-free".

  - invariant: "z(9,10;3,4)=60"
    n: 19
    edges: 60
    graph6: "RsaCAs@?OALQ?@IilfBlSNK`wI?{s?"
    graph_file: graphs/z9_10_34.g6
    hog_id: 56652
    hog_url: https://houseofgraphs.org/graphs/56652
    status: deposited
    certificates: both
    non_iso_minima: null
    zenodo: 10.5281/zenodo.19985042
    verified: true
    oeis: A006622
    parts: [9, 10]
    k34_free: false
    notes: >-
      Bipartite, parts of size 9 and 10, 60 edges, no 3-by-4 all-ones submatrix.
      NOT K_(3,4)-free: a K_(3,4) occurs in the permitted 4-by-3 orientation
      (verified). Comment corrected on 2026-06-30. graph6 contains a literal
      backtick.

  - invariant: "z(9,11;3,4)=66"
    n: 20
    edges: 66
    graph6: "SsaCC?t?G@?CWt??ipjWqVTPy[?uq@]Y?"
    graph_file: graphs/z9_11_34.g6
    hog_id: 56651
    hog_url: https://houseofgraphs.org/graphs/56651
    status: deposited
    certificates: both
    non_iso_minima: null
    zenodo: 10.5281/zenodo.19985042
    verified: true
    oeis: A006625
    parts: [9, 11]
    k34_free: true
    notes: >-
      Bipartite, parts of size 9 and 11, 66 edges. This one IS genuinely
      K_(3,4)-free: no 3 vertices on either side share 4 common neighbours
      (verified in both orientations). The only one of the three Zarankiewicz
      witnesses for which the abstract "K_(3,4)-free" description is true.
